openapi: 3.0.0
info:
  version: v1
  title: 'WSO2 Identity Server - Policy API Definition'
  description: 'This document specifies a RESTful API for WSO2 Identity Server Policy Management'
  contact:
    name: WSO2
    url: 'http://wso2.com/products/identity-server/'
    email: architecture@wso2.org
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
security:
  - OAuth2: []
  - BasicAuth: []
paths:
  /policies:
    get:
      tags:
        - Policy Management
      summary: List policies.
      operationId: getPolicies
      description: This API provides the capability to retrieve a paginated list of  policies for the tenant, optionally filtered by name.
      parameters:
        - name: limit
          in: query
          description: Maximum number of records to return.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 30
        - name: offset
          in: query
          description: Number of records to skip for pagination.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: filter
          in: query
          description: Filter policies whose name contains the given value (case-insensitive). If omitted, all policies are returned.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Policy Management
      summary: Create a policy.
      operationId: addPolicy
      description: This API provides the capability to create a new policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
      responses:
        '201':
          description: Successfully Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /policies/{policy-id}:
    get:
      tags:
        - Policy Management
      summary: Get a  policy by ID.
      operationId: getPolicyById
      description: This API provides the capability to retrieve a policy by ID.
      parameters:
        - name: policy-id
          in: path
          description: ID of the  policy
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Policy Management
      summary: Update a policy.
      operationId: updatePolicy
      description: This API provides the capability to update an existing policy.
      parameters:
        - name: policy-id
          in: path
          description: ID of the policy
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Policy Management
      summary: Delete a  policy.
      operationId: deletePolicy
      description: This API provides the capability to delete a  policy by ID.
      parameters:
        - name: policy-id
          in: path
          description: ID of the  policy
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successfully Deleted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
servers:
  - url: 'https://{server-url}/t/{tenant-domain}/api/server/v1'
    variables:
      server-url:
        default: "localhost:9443"
      tenant-domain:
        default: carbon.super
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: 'https://localhost:9443/oauth2/authorize'
          tokenUrl: 'https://localhost:9443/oauth2/token'
          scopes:
            read: internal_policy_mgt_view
            write: internal_policy_mgt_create
            update: internal_policy_mgt_update
            delete: internal_policy_mgt_delete
  schemas:
    PolicyRequest:
      type: object
      required:
        - name
        - resources
      example:
        name: "Corporate  Policy"
        resources:
          - target: "ios"
            resourceType: "RULE"
            rule:
              condition: "OR"
              rules:
                - condition: "AND"
                  expressions:
                    - field: "osVersion"
                      operator: "equals"
                      value: "16.0"
                    - field: "jailbreak"
                      operator: "equals"
                      value: "false"
      properties:
        name:
          type: string
          description: The name of the policy.
          example: "Corporate Policy"
        resources:
          type: array
          description: Resources attached to the policy. Each target may have at most one resource of each type.
          items:
            $ref: '#/components/schemas/PolicyResourceRequest'
    PolicyResourceRequest:
      type: object
      required:
        - target
        - rule
      properties:
        target:
          type: string
          description: The selector value this resource applies to (e.g. platform - android, ios, macos, windows).
          example: "ios"
        resourceType:
          type: string
          enum: [RULE, ACTION]
          description: The type of resource. Defaults to RULE. Only RULE is currently supported.
          example: "RULE"
        rule:
          $ref: '#/components/schemas/RuleRequest'
    RuleRequest:
      type: object
      description: A rule that combines one or more AND-grouped sub-rules with an OR condition;
        the rule is satisfied when any sub-rule is satisfied.
      required:
        - rules
      properties:
        condition:
          type: string
          enum: ["OR"]
          description: The logical operator combining the sub-rules. Always "OR".
          example: "OR"
        rules:
          type: array
          minItems: 1
          description: The AND-grouped sub-rules combined with OR.
          items:
            $ref: '#/components/schemas/ANDRuleRequest'
    ANDRuleRequest:
      type: object
      description: A sub-rule that combines expressions with an AND condition; satisfied only
        when all of its expressions evaluate to true.
      required:
        - condition
        - expressions
      properties:
        condition:
          type: string
          enum: ["AND"]
          description: The logical operator combining the expressions. Always "AND".
          example: "AND"
        expressions:
          type: array
          minItems: 1
          description: The list of expressions combined with AND.
          items:
            $ref: '#/components/schemas/ExpressionRequest'
    ExpressionRequest:
      type: object
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          description: The field to evaluate.
          example: "device.platform"
        operator:
          type: string
          description: The operator to apply.
          example: "equals"
        value:
          type: string
          description: The value to compare against.
          example: "Android"
    PolicyListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: Number of results that match the listing operation.
          example: 42
        startIndex:
          type: integer
          description: Index of the first element of the page, which will be equal to offset + 1.
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page.
          example: 10
        policies:
          type: array
          description: Page of policy summaries.
          items:
            $ref: '#/components/schemas/PolicyListItem'
        links:
          type: array
          description: Pagination links (next/previous).
          items:
            $ref: '#/components/schemas/PolicyListLink'
    PolicyListItem:
      type: object
      properties:
        id:
          type: string
          description: The policy resource ID.
          example: "74070bae-df8c-42bf-8754-5173c237c936"
        name:
          type: string
          description: The name of the policy.
          example: "Corporate Device Policy"
        self:
          type: string
          description: Location of the policy resource.
          example: "/t/carbon.super/api/server/v1/policies/74070bae-df8c-42bf-8754-5173c237c936"
    PolicyListLink:
      type: object
      properties:
        href:
          type: string
          description: Relative URL to the linked page.
          example: "/t/carbon.super/api/server/v1/policies?offset=10&limit=10"
        rel:
          type: string
          description: Relation to the current page.
          example: "next"
    PolicyResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: The policy resource ID.
          example: "74070bae-df8c-42bf-8754-5173c237c936"
        name:
          type: string
          description: The name of the policy.
          example: "Corporate Device Policy"
        resources:
          type: array
          description: Resources associated with the policy.
          items:
            $ref: '#/components/schemas/PolicyResourceResponse'
    PolicyResourceResponse:
      type: object
      properties:
        id:
          type: string
          description: The policy-resource association ID.
          example: "pr-456"
        target:
          type: string
          description: The selector value this resource applies to (e.g. device platform).
          example: "ios"
        resourceType:
          type: string
          enum: [RULE, ACTION]
          description: The type of resource.
          example: "RULE"
        resourceId:
          type: string
          description: The ID of the attached resource (rule ID or action ID).
          example: "rule-123"
        rule:
          $ref: '#/components/schemas/RuleResponse'
    RuleResponse:
      type: object
      properties:
        rules:
          type: array
          description: List of AND-combined expression groups, OR'd together.
          items:
            $ref: '#/components/schemas/ANDRuleResponse'
    ANDRuleResponse:
      type: object
      properties:
        expressions:
          type: array
          description: Expressions combined with AND logic.
          items:
            $ref: '#/components/schemas/ExpressionResponse'
    ExpressionResponse:
      type: object
      properties:
        field:
          type: string
          description: The field to evaluate.
          example: "platform"
        displayName:
          type: string
          description: The human-readable display name of the field.
          example: "Platform"
        operator:
          type: string
          description: The operator to apply.
          example: "equals"
        value:
          $ref: '#/components/schemas/ExpressionValue'
    ExpressionValue:
      type: object
      properties:
        type:
          type: string
          enum: [STRING, NUMBER, BOOLEAN, DATE_TIME, REFERENCE, RAW, LIST, SYMBOLIC]
          description: The value type.
          example: "STRING"
        value:
          type: string
          description: The value to compare against.
          example: "ios"
    Error:
      type: object
      properties:
        code:
          type: string
          example: PM-60001
        message:
          type: string
          example: Some Error Message.
        description:
          type: string
          example: Some Error Description.
        traceId:
          type: string
          example: "e0fbcfeb-3617-43c4-8dd0-7b7d38e13047"
