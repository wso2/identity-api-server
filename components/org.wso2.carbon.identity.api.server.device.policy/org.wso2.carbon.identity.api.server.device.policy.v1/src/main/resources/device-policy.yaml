openapi: 3.0.0
info:
  version: v1
  title: 'WSO2 Identity Server - Device Policy API'
  description: 'This document specifies a RESTful API for WSO2 Identity Server Device Policy Management'
  contact:
    name: WSO2
    url: 'http://wso2.com/products/identity-server/'
    email: architecture@wso2.org
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
security:
  - OAuth2: []
  - BasicAuth: []
paths:
  /device-policies/metadata:
    get:
      tags:
        - Device Policy Management
      summary: Get device policy field metadata filtered by platform.
      operationId: getDevicePolicyMetadata
      description: |
        Returns the list of rule fields applicable for the devicePolicy flow,
        optionally filtered to a specific platform. Used by the UI to populate
        the rule builder with platform-relevant fields only.
      parameters:
        - name: platform
          in: query
          description: Filter fields to those applicable for this platform. If omitted all fields are returned.
          required: false
          schema:
            type: string
            enum:
              - android
              - ios
              - macos
              - windows
      responses:
        '200':
          description: Applicable fields for the given platform.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DevicePolicyFieldDefinition'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
servers:
  - url: 'https://localhost:9443/t/{tenant-domain}/api/server/v1'
    variables:
      tenant-domain:
        default: carbon.super
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: 'https://localhost:9443/oauth2/authorize'
          tokenUrl: 'https://localhost:9443/oauth2/token'
          scopes:
            read: internal_device_policy_view
  schemas:
    DevicePolicyFieldDefinition:
      type: object
      properties:
        field:
          $ref: '#/components/schemas/DevicePolicyField'
        operators:
          type: array
          items:
            $ref: '#/components/schemas/DevicePolicyOperator'
        value:
          $ref: '#/components/schemas/DevicePolicyValue'
    DevicePolicyField:
      type: object
      properties:
        name:
          type: string
          example: platform
        displayName:
          type: string
          example: platform
    DevicePolicyOperator:
      type: object
      properties:
        name:
          type: string
          example: equals
        displayName:
          type: string
          example: equals
    DevicePolicyValue:
      type: object
      properties:
        inputType:
          type: string
          enum: [input, options]
          example: options
        valueType:
          type: string
          enum: [string, number, boolean, date, reference, symbolic]
          example: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/DevicePolicyValueObject'
        links:
          type: array
          items:
            $ref: '#/components/schemas/DevicePolicyLink'
    DevicePolicyValueObject:
      type: object
      properties:
        name:
          type: string
          example: android
        displayName:
          type: string
          example: Android
    DevicePolicyLink:
      type: object
      properties:
        href:
          type: string
        method:
          type: string
          enum: [GET]
        rel:
          type: string
          enum: [values, filter]
    Error:
      type: object
      properties:
        code:
          type: string
          example: DPM-65001
        message:
          type: string
          example: Some Error Message.
        description:
          type: string
          example: Some Error Description.
        traceId:
          type: string
          example: "e0fbcfeb-3617-43c4-8dd0-7b7d38e13047"
