openapi: 3.0.0
info:
  title: "WSO2 IS Presentation Definition Management API"
  version: "v1"
  description: "Admin API for managing presentation definitions in WSO2 Identity Server."
  contact:
    name: WSO2
    url: 'http://wso2.com/products/identity-server/'
    email: architecture@wso2.org
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'

servers:
  - url: 'https://{server-url}/t/{tenant-domain}/api/server/v1'
    variables:
      server-url:
        default: localhost:9443
      tenant-domain:
        default: carbon.super

security:
  - OAuth2: []
  - BasicAuth: []

paths:
  /vp/template:
    get:
      tags:
        - Presentation Definitions
      summary: List Presentation Definitions
      description: |
        Returns a list of all presentation definitions for the tenant.
      operationId: listPresentationDefinitions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationDefinitionList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Presentation Definitions
      summary: Create a Presentation Definition
      description: |
        Creates a new presentation definition.
      operationId: createPresentationDefinition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationDefinitionCreationModel'
        required: true
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URI of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationDefinitionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vp/template/{definition-id}:
    get:
      tags:
        - Presentation Definitions
      summary: Get a Presentation Definition
      description: |
        Retrieves a presentation definition by its ID.
      operationId: getPresentationDefinition
      parameters:
        - $ref: '#/components/parameters/definitionIdPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationDefinitionResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Presentation Definitions
      summary: Update a Presentation Definition
      description: |
        Partially updates an existing presentation definition.
      operationId: updatePresentationDefinition
      parameters:
        - $ref: '#/components/parameters/definitionIdPathParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationDefinitionUpdateModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationDefinitionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Presentation Definitions
      summary: Delete a Presentation Definition
      description: |
        Deletes a presentation definition by its ID.
      operationId: deletePresentationDefinition
      parameters:
        - $ref: '#/components/parameters/definitionIdPathParam'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vp/template/{definition-id}/trusted-cas:
    patch:
      tags:
        - Presentation Definitions
      summary: Update Trusted CAs for a Credential
      description: |
        Add, remove, or replace a trusted CA certificate for a specific requested
        credential in a presentation definition. Each operation targets a single
        certificate by index.
      operationId: patchTrustedCas
      parameters:
        - $ref: '#/components/parameters/definitionIdPathParam'
        - name: credential-id
          in: query
          description: The credential query ID to target.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CertificatePatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationDefinitionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    definitionIdPathParam:
      name: definition-id
      in: path
      description: Unique identifier of the presentation definition.
      required: true
      schema:
        type: string

  schemas:
    PresentationDefinitionResponse:
      type: object
      required:
        - id
        - name
        - credentials
      properties:
        id:
          type: string
          description: Unique identifier of the presentation definition.
          example: "pd-001"
        name:
          type: string
          description: Name of the presentation definition.
          example: "Employee Credential Verification"
        description:
          type: string
          description: Description of the presentation definition.
          example: "Verifies employee credentials"
        credentials:
          type: array
          description: The list of requested credentials in this presentation definition.
          maxItems: 1
          items:
            $ref: '#/components/schemas/RequestedCredentialModel'

    RequestedCredentialModel:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: >
            User-defined identifier for this credential entry. Must contain only alphanumeric
            characters, underscores, or hyphens (e.g. "employee_badge"). Used as the DCQL
            credential query id and as the primary key in storage.
          example: "employee_badge"
        type:
          type: string
          description: Type of the requested credential.
          example: "EmployeeBadge"
        format:
          type: string
          default: dc+sd-jwt
          enum: [dc+sd-jwt, mso_mdoc, jwt_vc_json]
          description: >
            Credential format as defined by OID4VP §6.1. Specifies which credential format
            this query targets. Defaults to dc+sd-jwt (SD-JWT VC).
          example: "dc+sd-jwt"
        claims:
          type: array
          description: List of claims requested from this credential.
          items:
            type: string
            example: "email"
        enforceTrustedIssuer:
          type: boolean
          default: false
          description: >
            When true, the credential's x5c chain is validated up to one of the configured
            trustedCaPems root CAs (PKIX chain validation). When false (default), the
            signature is verified without requiring a chain back to a specific CA.
        trustedCaPems:
          type: array
          description: >
            Base64-encoded PEM X.509 root CA certificates trusted for x5c chain validation.
            At least one CA must validate the chain when enforceTrustedIssuer is true.
            CA certs must NOT appear in the x5c chain itself (HAIP §6.1.1).
          items:
            type: string
            example: "LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t..."
        keyResolutionMethod:
          type: string
          default: x5c
          enum: [x5c, jwks_uri, pem, metadata_discovery]
          description: >
            Key resolution method for verifying the issuer's credential signature.
            Defaults to x5c (extracts public key from the x5c JOSE header).
        jwksUri:
          type: string
          maxLength: 2048
          description: >
            JWKS endpoint URL for fetching the issuer's public key.
            Required when keyResolutionMethod is 'jwks_uri'.
          example: "https://issuer.example.com/.well-known/jwks.json"
        issuerPem:
          type: string
          description: >
            PEM-encoded issuer X.509 certificate. The public key is extracted from this
            certificate for signature verification. Required when keyResolutionMethod is 'pem'.
          example: "-----BEGIN CERTIFICATE-----\n..."
        metadataEndpoint:
          type: string
          maxLength: 2048
          description: >
            OpenID Connect metadata endpoint (e.g. /.well-known/openid-configuration)
            used to discover the issuer's jwks_uri. Required when keyResolutionMethod
            is 'metadata_discovery'.
          example: "https://issuer.example.com/.well-known/openid-configuration"

    PresentationDefinitionCreationModel:
      type: object
      required:
        - name
        - credentials
      properties:
        name:
          type: string
          description: Name of the presentation definition.
          example: "Employee Credential Verification"
        description:
          type: string
          description: Description of the presentation definition.
          example: "Verifies employee credentials"
        credentials:
          type: array
          description: The requested credentials to construct the definition.
          maxItems: 1
          items:
            $ref: '#/components/schemas/RequestedCredentialModel'

    PresentationDefinitionUpdateModel:
      type: object
      properties:
        name:
          type: string
          description: Name of the presentation definition.
          example: "Updated Employee Credential Verification"
        description:
          type: string
          description: Description of the presentation definition.
        credentials:
          type: array
          description: The requested credentials to construct the definition.
          maxItems: 1
          items:
            $ref: '#/components/schemas/RequestedCredentialModel'

    PresentationDefinitionList:
      type: object
      properties:
        totalResults:
          type: integer
          description: Total number of presentation definitions.
          example: 2
        presentationDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/PresentationDefinitionListItem'

    PresentationDefinitionListItem:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the presentation definition.
          example: "pd-001"
        name:
          type: string
          description: Name of the presentation definition.
          example: "Employee Credential Verification"
        description:
          type: string
          description: Description of the presentation definition.

    CertificatePatch:
      type: object
      required:
        - operation
      properties:
        operation:
          type: string
          enum: [ADD, REMOVE, REPLACE]
          description: The patch operation to perform.
        certificateIndex:
          type: integer
          description: Zero-based index of the certificate to remove or replace.
        certificate:
          type: string
          description: Base64-encoded PEM certificate (required for ADD and REPLACE).

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "VPD-60001"
        message:
          type: string
          example: "Some error message"
        description:
          type: string
          example: "Some error description"
        traceId:
          type: string
          example: "e0fbcfeb-3617-43c4-8dd0-7b7d38e13047"

  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: 'https://localhost:9443/oauth2/authorize'
          tokenUrl: 'https://localhost:9443/oauth2/token'
          scopes: {}
