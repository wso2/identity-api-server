openapi: 3.0.0
info:
  version: "v1"
  title: WSO2 Identity Server - VP Presentation Definition Management API
  description: >-
    This is the RESTful API for managing VP Presentation Definitions in the
    WSO2 Identity Server.
  contact:
    name: WSO2 Identity Server
    url: 'https://wso2.com/identity-and-access-management/'
    email: architecture@wso2.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
security:
  - OAuth2: []
  - BasicAuth: []
paths:
  /vp/template:
    get:
      tags:
        - Presentation Definitions
      summary: List presentation definitions.
      operationId: listPresentationDefinitions
      description: |
        Returns a paginated list of presentation definitions for the tenant.

        <b>scope required:</b>
        * internal_list_vp_templates
      parameters:
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/beforeQueryParam'
        - $ref: '#/components/parameters/afterQueryParam'
        - $ref: '#/components/parameters/filterQueryParam'
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/PresentationDefinitionList'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Presentation Definitions
      summary: Create a presentation definition.
      operationId: createPresentationDefinition
      description: |
        Creates a new presentation definition.

        <b>scope required:</b>
        * internal_create_vp_template
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationDefinitionCreationModel'
        description: Presentation definition to be created.
        required: true
      responses:
        '201':
          description: Item Created
          headers:
            Location:
              description: URI of the created resource.
              schema:
                type: string
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/PresentationDefinitionResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  '/vp/template/{definition-id}':
    get:
      tags:
        - Presentation Definitions
      summary: Get a presentation definition.
      operationId: getPresentationDefinition
      description: |
        Retrieves a presentation definition by its ID.

        <b>scope required:</b>
        * internal_view_vp_template
      parameters:
        - $ref: '#/components/parameters/definitionIdPathParam'
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/PresentationDefinitionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Presentation Definitions
      summary: Update a presentation definition.
      operationId: updatePresentationDefinition
      description: |
        Partially updates an existing presentation definition.

        <b>scope required:</b>
        * internal_update_vp_template
      parameters:
        - $ref: '#/components/parameters/definitionIdPathParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationDefinitionUpdateModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/PresentationDefinitionResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Presentation Definitions
      summary: Delete a presentation definition.
      operationId: deletePresentationDefinition
      description: |
        Deletes a presentation definition by its ID.

        <b>scope required:</b>
        * internal_delete_vp_template
      parameters:
        - $ref: '#/components/parameters/definitionIdPathParam'
      responses:
        '204':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  '/vp/template/{definition-id}/trusted-cas':
    patch:
      tags:
        - Presentation Definitions
      summary: Update trusted CAs for a credential.
      operationId: patchTrustedCas
      description: |
        Add, remove, or replace a trusted CA certificate for a specific requested
        credential within a presentation definition.

        <b>scope required:</b>
        * internal_update_vp_template
      parameters:
        - $ref: '#/components/parameters/definitionIdPathParam'
        - name: credential-id
          in: query
          description: The credential query ID to target.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CertificatePatch'
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/PresentationDefinitionResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  '/vp/template/{definition-id}/connected-connections':
    get:
      tags:
        - Presentation Definitions
      summary: List connections using this definition.
      operationId: getConnectedConnections
      description: |
        Returns all federated connections (identity providers) that reference
        the specified presentation definition.

        <b>scope required:</b>
        * internal_view_vp_template
      parameters:
        - $ref: '#/components/parameters/definitionIdPathParam'
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ConnectedConnectionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  parameters:
    definitionIdPathParam:
      name: definition-id
      in: path
      description: Unique identifier of the presentation definition.
      required: true
      schema:
        type: string
    limitQueryParam:
      in: query
      name: limit
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        default: 10
    beforeQueryParam:
      in: query
      name: before
      required: false
      description: >-
        Cursor for backward pagination — returns records before this opaque
        cursor value (Base64-encoded).
      schema:
        type: string
    afterQueryParam:
      in: query
      name: after
      required: false
      description: >-
        Cursor for forward pagination — returns records after this opaque
        cursor value (Base64-encoded).
      schema:
        type: string
    filterQueryParam:
      in: query
      name: filter
      required: false
      description: >-
        Filter expression in SCIM-style format (e.g. name eq "Employee Verification").
      schema:
        type: string
  responses:
    NotFound:
      description: The specified resource is not found.
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized.
    Forbidden:
      description: Resource forbidden.
    ServerError:
      description: Internal server error.
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/Error'
    InvalidInput:
      description: Invalid input request.
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Element already exists.
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/Error'
    Deleted:
      description: No content.
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: 'https://localhost:9443/oauth2/authorize'
          tokenUrl: 'https://localhost:9443/oauth2/token'
          scopes: {}
  schemas:
    PresentationDefinitionResponse:
      type: object
      required:
        - id
        - name
        - credentials
      properties:
        id:
          type: string
          description: Unique identifier of the presentation definition.
          example: "pd-001"
        name:
          type: string
          description: Name of the presentation definition.
          example: "Employee Credential Verification"
        description:
          type: string
          description: Description of the presentation definition.
          example: "Verifies employee credentials"
        credentials:
          type: array
          description: The list of requested credentials in this presentation definition.
          maxItems: 1
          items:
            $ref: '#/components/schemas/RequestedCredentialModel'

    RequestedCredentialModel:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: >
            User-defined identifier for this credential entry. Must contain only alphanumeric
            characters, underscores, or hyphens (e.g. "employee_badge"). Used as the DCQL
            credential query id and as the primary key in storage.
          example: "employee_badge"
        type:
          type: string
          description: Type of the requested credential.
          example: "EmployeeBadge"
        format:
          type: string
          default: dc+sd-jwt
          enum: [dc+sd-jwt, mso_mdoc, jwt_vc_json]
          description: >
            Credential format as defined by OID4VP §6.1. Specifies which credential format
            this query targets. Defaults to dc+sd-jwt (SD-JWT VC).
          example: "dc+sd-jwt"
        claims:
          type: array
          description: List of claims requested from this credential.
          items:
            type: string
            example: "email"
        enforceTrustedIssuer:
          type: boolean
          default: false
          description: >
            When true, the credential's x5c chain is validated against the configured
            trustedCaPems root CAs. When false (default), the signature is verified
            without requiring a chain back to a specific CA.
        trustedCaPems:
          type: array
          description: >
            Base64-encoded PEM X.509 root CA certificates trusted for x5c chain validation.
            Required when enforceTrustedIssuer is true.
          items:
            type: string
            example: "LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t..."
        keyResolutionMethod:
          type: string
          default: x5c
          enum: [x5c, jwks_uri, pem, metadata_discovery]
          description: >
            Key resolution method for verifying the issuer's credential signature.
            Defaults to x5c (extracts the public key from the x5c JOSE header).
        jwksUri:
          type: string
          maxLength: 2048
          description: >
            JWKS endpoint URL for fetching the issuer's public key.
            Required when keyResolutionMethod is 'jwks_uri'.
          example: "https://issuer.example.com/.well-known/jwks.json"
        issuerPem:
          type: string
          description: >
            PEM-encoded issuer X.509 certificate. The public key is extracted for
            signature verification. Required when keyResolutionMethod is 'pem'.
          example: "-----BEGIN CERTIFICATE-----\n..."
        metadataEndpoint:
          type: string
          maxLength: 2048
          description: >
            OpenID Connect metadata endpoint used to discover the issuer's jwks_uri.
            Required when keyResolutionMethod is 'metadata_discovery'.
          example: "https://issuer.example.com/.well-known/openid-configuration"

    PresentationDefinitionCreationModel:
      type: object
      required:
        - name
        - credentials
      properties:
        name:
          type: string
          description: Name of the presentation definition.
          example: "Employee Credential Verification"
        description:
          type: string
          description: Description of the presentation definition.
          example: "Verifies employee credentials"
        credentials:
          type: array
          description: The requested credentials to construct the definition.
          maxItems: 1
          items:
            $ref: '#/components/schemas/RequestedCredentialModel'

    PresentationDefinitionUpdateModel:
      type: object
      properties:
        name:
          type: string
          description: Name of the presentation definition.
          example: "Updated Employee Credential Verification"
        description:
          type: string
          description: Description of the presentation definition.
        credentials:
          type: array
          description: The requested credentials to construct the definition.
          maxItems: 1
          items:
            $ref: '#/components/schemas/RequestedCredentialModel'

    PresentationDefinitionList:
      type: object
      properties:
        totalResults:
          type: integer
          description: Total number of presentation definitions matching the request.
          example: 2
        presentationDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/PresentationDefinitionListItem'
        links:
          type: array
          description: Pagination links (prev/next).
          items:
            $ref: '#/components/schemas/PaginationLink'
          example:
            - href: "/api/server/v1/vp/template?after=eyJuYW1lIjoiQSJ9&limit=10"
              rel: "next"

    PresentationDefinitionListItem:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the presentation definition.
          example: "pd-001"
        name:
          type: string
          description: Name of the presentation definition.
          example: "Employee Credential Verification"
        description:
          type: string
          description: Description of the presentation definition.

    ConnectedConnectionsResponse:
      type: object
      properties:
        count:
          type: integer
          description: Number of connections returned.
          example: 2
        totalResults:
          type: integer
          description: Total number of connections referencing this definition.
          example: 2
        connectedConnections:
          type: array
          description: List of connections referencing the presentation definition.
          items:
            $ref: '#/components/schemas/ConnectedConnectionItem'

    ConnectedConnectionItem:
      type: object
      properties:
        connectionId:
          type: string
          description: Unique identifier of the federated connection.
          example: "63f0b5e7-6e10-4de7-8e5c-1d0f9283f44b"
        name:
          type: string
          description: Display name of the connection.
          example: "University Wallet IDP"
        self:
          type: string
          description: Self-link URL to the connection resource.
          example: "https://localhost:9443/api/server/v1/identity-providers/63f0b5e7-6e10-4de7-8e5c-1d0f9283f44b"

    CertificatePatch:
      type: object
      required:
        - operation
      properties:
        operation:
          type: string
          enum: [ADD, REMOVE, REPLACE]
          description: The patch operation to perform.
        certificateIndex:
          type: integer
          description: Zero-based index of the certificate to remove or replace.
        certificate:
          type: string
          description: Base64-encoded PEM certificate (required for ADD and REPLACE).

    PaginationLink:
      type: object
      properties:
        href:
          type: string
          description: URL of the linked page.
          example: "/api/server/v1/vp/template?after=eyJuYW1lIjoiQSJ9&limit=10"
        rel:
          type: string
          description: Link relation — 'next' or 'prev'.
          example: "next"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "VPD-60001"
        message:
          type: string
          example: "Some error message."
        description:
          type: string
          example: "Some error description."
        traceId:
          type: string
          example: "e0fbcfeb-3617-43c4-8dd0-7b7d38e13047"
